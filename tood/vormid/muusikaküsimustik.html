<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Muusika küsimustik</title>
    <script src="../js/muusikaküsimustikScript.js"></script>
</head>
<body>
<h1>Muusika küsimustik</h1>
<form action="#">
    <table border="1">
        <tr>
            <td>
                <label for="arvamus">Mida arvad muusika kuulamisest koolis?</label>
            </td>
            <td>
                <input type="text" id="arvamus" oninput="arvamusLugemine()">
            </td>
            <td>
                <div id="vastus1"></div>
            </td>
        </tr>
        <tr>
            <td>
                <label>Kas sa kuulad raadiot?</label>
            </td>
            <td>
                <input type="radio" name="jahei" id="jah" value="jah" onclick="jaheiValik()">
                <label for="jah">jah</label>
                <br>
                <input type="radio" name="jahei" id="ei" value="ei" onclick="jaheiValik()">
                <label for="ei">ei</label>
            </td>
            <td>
                <div id="vastus2"></div>
            </td>
        </tr>
        <tr>
            <td colspan="2">
                <fieldset>
                    <label>Millist muusikat sa kõige rohkem kuulad?</label>
                    <br>
                    <input type="checkbox" name="muusika" id="rock" value="rock" onclick="muusikaValik()">
                    <label for="rock">rock</label>
                    <br>
                    <input type="checkbox" name="muusika" id="rap" value="rap" onclick="muusikaValik()">
                    <label for="rap">rap</label>
                    <br>
                    <input type="checkbox" name="muusika" id="Classical" value="Classical" onclick="muusikaValik()">
                    <label for="Classical">Classical</label>
                    <br>
                    <input type="checkbox" name="muusika" id="hiphop" value="hiphop" onclick="muusikaValik()">
                    <label for="hiphop">hiphop</label>
                    <br>
                    <input type="checkbox" name="muusika" id="lofi" value="lofi" onclick="muusikaValik()">
                    <label for="lofi">lofi</label>
                    <br>
                    <input type="checkbox" name="muusika" id="jazz" value="jazz" onclick="muusikaValik()">
                    <label for="jazz">jazz</label>
                </fieldset>
            </td>
            <td>
                <div id="vastus3"></div>
            </td>
        </tr>
        <tr>
            <td>
                <label for="kuulamine">Mitu tundi päevas sa kuulad muusikat?</label>
            </td>
            <td>
                <input type="range" id="kuulamine" min="0" max="24" onchange="rangeValik()">
            </td>
            <td>
                <div id="vastus4"></div>
            </td>
        </tr>
        <tr>
            <td colspan="2">
                <fieldset>
                    <label>Milliseid muusikuid/ansambleid sa tead?</label>
                    <br>
                    <input type="checkbox" name="muusikud" id="Nublu" value="Nublu" onclick="muusikuteValik()">
                    <label for="Nublu">Nublu</label>
                    <br>
                    <input type="checkbox" name="muusikud" id="TommyCash" value="TommyCash" onclick="muusikuteValik()">
                    <label for="TommyCash">TommyCash</label>
                    <br>
                    <input type="checkbox" name="muusikud" id="ElinaBorn" value="ElinaBorn" onclick="muusikuteValik()">
                    <label for="ElinaBorn">Elina Born</label>
                    <br>
                    <input type="checkbox" name="muusikud" id="KoitToome" value="KoitToome" onclick="muusikuteValik()">
                    <label for="KoitToome">Koit Toome</label>
                    <br>
                    <input type="checkbox" name="muusikud" id="Lenna" value="Lenna" onclick="muusikuteValik()">
                    <label for="Lenna">Lenna</label>
                </fieldset>
            </td>
            <td>
                <div id="vastus5"></div>
            </td>
        </tr>
        <tr>
            <td>
                <input type="reset" value="Puhasta" onclick="puhasta()">
            </td>
            <td>
                <input type="button" value="Näita andmed" onclick="tervitus()">
            </td>
            <td>
                <div id="vastus6"></div>
            </td>
        </tr>
    </table>
</form>

</body>
</html>
