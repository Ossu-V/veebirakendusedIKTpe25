<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Map area kasutamine</title>
    <link rel="stylesheet" href="mapStyle.css">
</head>
<body>
<h1>Lehel on kasutad map area käsud</h1>
<h2>palun kliki hiirega erineva alale oleval pildil</h2>
<img src="maja.png" alt="ilus majake" usemap="#majakaart">
<!-- kasutame map'i (kaart) -->
<map name="majakaart">
    <!-- ring -circle coords=x, y, R -->
    <area shape="circle" coords="151,173,50" href="aken.html" alt="aken">
    <!-- ristkülik rect coords=x ,y x1, y2, -->
    <area shape="rect" coords="195,22, 226, 73" href="korsten.html" alt="korsten">
    <!-- mitu nurga polügoon -poly coords=x, y, x1, y1, x2, y2-kolmnurk-->
    <area shape="poly" coords="44, 115, 143, 12, 258, 108" href="katus.html" alt="katus">
</map>

<img src="iseseisevmapkaart.png" alt="Iseseisev töö map kaart" usemap="#iseseisevtöökaart">
<map name="iseseisevtöökaart">
    <!-- ring -circle coords=x, y, R -->
    <area shape="circle" coords="34, 57" href="puu.html" alt="puu">
    <area shape="circle" coords="258, 31" href="päike.html" alt="päike">
    <area shape="circle" coords="137, 247" href="ratas.html" alt="ratas">
    <area shape="circle" coords="234, 245" href="ratas.html" alt="ratas">
    <!-- ristkülik rect coords=x ,y x1, y2, -->
    <area shape="rect" coords="16, 118, 38, 117, 51, 250, 14, 243" href="puutüvi.html" alt="puutüvi">
    <area shape="poly" coords="" href="püramid.html" alt="püramid">





</map>

<div id="selgitus">
    Vajuta pildiala peale ja siia tuleb väike kirjeldus...
</div>

</body>
</html>
