<!DOCTYPE html><!--deklaratsioon, et kasutame html5-->
<!--kommentaar-->
<html lang="et">
<head> <!--tehniline info-->
    <meta charset="UTF-8">
    <title>Oscar veebirakenduste aluste tööd</title>
    <link rel="stylesheet" href="style.css">
    <script src="tood/js/kpjakellaajaKuvamine.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
            integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
            crossorigin="anonymous"></script>

    <script>
        $(document).ready(function () {
            //paremale nuppu vajutamine
            $('#paremale').click(function () {
                $('#osa1').animate({left: '200px'}, 1000);
                $(this).hide();
                $('#vasakule').show();
            });
            //vasakule nuppu vajutamine
            $('#vasakule').click(function () {
                $('#osa1').animate({left: '0px'}, 1000);
                $(this).hide();
                $('#paremale').show();
            });
        })
    </script>
</head>
<body>
<!--veebilehe sisu, mis kasutaja näeb-->
<!--päis-->
<header>
    <h1>
        Oscar veebirakenduste aluste tööd
    </h1>
</header>
<!--navigeerimismenüü-->
<nav>
    <ul>
        <li>
            <a href="index.html">Avaleht</a>
        </li>
        <li>

        </li>
        <li>
            <a href="tehtud.html">Tehtud tööd</a>
        </li>
        <li>
            <a href="lingid.html">Kasulikud lingid</a>
        </li>
        <li>
            <a href="meedia.html">Meedia</a>
        </li>
    </ul>
</nav>
<!--sisu-->
<main>
    <section id="osa1">
        <h2>Tere tulemast!</h2>
        <p>See on veebirakenduste tunnis
            käsitsi kirjutatud leht</p>
        <p>Palun kasuta navigeerimismenüüd, et leida info!</p>
    </section>
    <input type="button" value="vasakule" id="vasakule">
    <input type="button" value="paremale" id="paremale">

    <section id="osa2">
        <h2>Päevapilt</h2>
        <div>Ise tehtud pilt</div>
        <br>
        <img src="Uss.png" alt="Uss" id="erapilt">

        <input type="button" value="TÄNA ON" onclick="tanaOn()">
        <div id="vastus"></div>
    </section>
</main>
<!--jalus-->
<footer>
    <div>
        Oscar Välk
    </div>
</footer>

</body>
</html>
