<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Muusika küsimustik</title>
    <link rel="stylesheet" href="muusikaStyle.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
            integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
            crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/ui/1.14.2/jquery-ui.min.js"
            integrity="sha256-mblSWfbYzaq/f+4akyMhE6XELCou4jbkgPv+JQPER2M="
            crossorigin="anonymous"></script>
    <script src="../js/muusikaküsimustikScript.js"></script>

    <script>
        $(function(){
            // peidame vead
            $('.viga').hide();

            // puhastusnupp
            $('#puhastaNupp').click(function(){
                puhastaVorm();
                $('.viga').hide();
            });

            // vormi kontrollimine
            $('#naitaNupp').click(function(){
                let valid = true;
                $('.viga').css('color', 'red');

                // tekstiväli
                let tekst = $('#arvamus').val().trim();
                if(tekst === "" || !/^[a-zA-ZäöüõÄÖÜÕ\s]+$/.test(tekst)){
                    $('#viga5').show();
                    valid = false;
                } else {
                    $('#viga5').hide();
                }

                // raadio-nupud
                if($('input[name="jahei"]:checked').length === 0){
                    $('#viga4').show();
                    valid = false;
                } else {
                    $('#viga4').hide();
                }

                // muusika stiilid
                if($('input[name="muusika"]:checked').length === 0){
                    $('#viga1').show();
                    valid = false;
                } else {
                    $('#viga1').hide();
                }

                // kuulamistunnid
                if($('#kuulamine').val() == "0"){
                    $('#viga2').show();
                    valid = false;
                } else {
                    $('#viga2').hide();
                }

                // muusikud
                if($('input[name="muusikud"]:checked').length === 0){
                    $('#viga3').show();
                    valid = false;
                } else {
                    $('#viga3').hide();
                }

                // kui vigu pole, näitame vastuseid
                if(valid){
                    tervitus();
                }
            });
        });
    </script>
</head>
<body>
<h1>Muusika küsimustik</h1>
<form id="muusikaVorm">
    <table border="1">
        <tr>
            <td>
                <label for="arvamus">Mida arvad muusika kuulamisest koolis?</label>
            </td>
            <td>
                <input type="text" id="arvamus" oninput="arvamusLugemine()">
            </td>
            <td>
                <div id="vastus1"></div>
                <span class="viga" id="viga5">Palun kirjuta tähtedega arvamus</span>
            </td>
        </tr>
        <tr>
            <td>
                <label>Kas sa kuulad raadiot?</label>
            </td>
            <td>
                <input type="radio" name="jahei" id="jah" value="jah" onclick="jaheiValik()">
                <label for="jah">jah</label>
                <br>
                <input type="radio" name="jahei" id="ei" value="ei" onclick="jaheiValik()">
                <label for="ei">ei</label>
            </td>
            <td>
                <div id="vastus2"></div>
                <img src="../pildid/tyhi.png" id="pilt" alt="Tulemuse pilt">
                <span class="viga" id="viga4">Palun tee valik</span>
            </td>
        </tr>
        <tr>
            <td colspan="2">
                <fieldset>
                    <label>Millist muusikat sa kõige rohkem kuulad?</label>
                    <br>
                    <input type="checkbox" name="muusika" id="rock" value="rock" onclick="muusikaValik()">
                    <label for="rock">rock</label>
                    <br>
                    <input type="checkbox" name="muusika" id="rap" value="rap" onclick="muusikaValik()">
                    <label for="rap">rap</label>
                    <br>
                    <input type="checkbox" name="muusika" id="Classical" value="Classical" onclick="muusikaValik()">
                    <label for="Classical">Classical</label>
                    <br>
                    <input type="checkbox" name="muusika" id="hiphop" value="hiphop" onclick="muusikaValik()">
                    <label for="hiphop">hiphop</label>
                    <br>
                    <input type="checkbox" name="muusika" id="lofi" value="lofi" onclick="muusikaValik()">
                    <label for="lofi">lofi</label>
                    <br>
                    <input type="checkbox" name="muusika" id="jazz" value="jazz" onclick="muusikaValik()">
                    <label for="jazz">jazz</label>
                </fieldset>
            </td>
            <td>
                <div id="vastus3"></div>
                <span class="viga" id="viga1">Palun vali vähemalt üks muusika stiil</span>
            </td>
        </tr>
        <tr>
            <td>
                <label for="kuulamine">Mitu tundi päevas sa kuulad muusikat?</label>
            </td>
            <td>
                <input type="range" id="kuulamine" min="0" max="24" value="0" onchange="rangeValik()">
            </td>
            <td>
                <div id="vastus4"></div>
                <span class="viga" id="viga2">Palun vali tundide arv</span>
            </td>
        </tr>
        <tr>
            <td colspan="2">
                <fieldset>
                    <label>Milliseid muusikuid/ansambleid sa tead?</label>
                    <br>
                    <input type="checkbox" name="muusikud" id="Nublu" value="Nublu" onclick="muusikuteValik()">
                    <label for="Nublu">Nublu</label>
                    <br>
                    <input type="checkbox" name="muusikud" id="TommyCash" value="TommyCash" onclick="muusikuteValik()">
                    <label for="TommyCash">TommyCash</label>
                    <br>
                    <input type="checkbox" name="muusikud" id="ElinaBorn" value="ElinaBorn" onclick="muusikuteValik()">
                    <label for="ElinaBorn">Elina Born</label>
                    <br>
                    <input type="checkbox" name="muusikud" id="KoitToome" value="KoitToome" onclick="muusikuteValik()">
                    <label for="KoitToome">Koit Toome</label>
                    <br>
                    <input type="checkbox" name="muusikud" id="Lenna" value="Lenna" onclick="muusikuteValik()">
                    <label for="Lenna">Lenna</label>
                </fieldset>
            </td>
            <td>
                <div id="vastus5"></div>
                <img src="../pildid/tyhi.png" id="pilt2" width="200" alt="Teise tulemuse pilt">
                <span class="viga" id="viga3">Palun vali vähemalt üks muusik</span>
            </td>
        </tr>
        <tr>
            <td>
                <input type="button" value="Puhasta" id="puhastaNupp">
            </td>
            <td>
                <input type="button" value="Näita andmed" id="naitaNupp">
            </td>
            <td>
                <div id="vastus6"></div>
            </td>
        </tr>
    </table>
</form>

</body>
</html>
