<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>jQuery kasutamine</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
            integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
            crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/ui/1.14.2/jquery-ui.min.js"
            integrity="sha256-mblSWfbYzaq/f+4akyMhE6XELCou4jbkgPv+JQPER2M="
            crossorigin="anonymous"></script>
  <script>
    $(document).ready(function () {
      //paremale nuppu vajutamine
      $('#paremale').click(function () {
        $('#tekstikast').animate({left: '200px'}, 1000);
        $(this).hide();
        $('#vasakule').show();
      });
      //vasakule nuppu vajutamine
      $('#vasakule').click(function () {
        $('#tekstikast').animate({left: '0px'}, 1000);
        $(this).hide();
        $('#paremale').show();
      });
    })

    //värvib teksti punaseks
    function tekstPunaseks(){
      $('#tekstikast').css('color','red');
    }
    function tekstMustaks(){
      $('#tekstikast').css('color','black');
    }
    function koordLugemine(event, ui){
        let  koht=ui.offset;
        $('#koordinaadid').html('x:' + koht.left + '|| y:' + koht.top);
    }

    $(document).ready(function () {
      $('#FadeToggle').click(function(){
        $('#tekstikast').fadeToggle();
      });
    })

    function leheStart(){
      $('#tekstikast').mouseenter(tekstPunaseks);
      $('#tekstikast').mouseleave(tekstMustaks);
      $('#tekstikast').draggable();
      $('#tekstikast').bind("drag", koordLugemine);
      $('#pilt').draggable();
      $('#pilt').bind("drag", koordLugemine);
      $('#pilt2').draggable();
      $('#pilt2').bind("drag", koordLugemine);
    }

  </script>

  <link rel="stylesheet" href="queryStyle.css">
</head>
<body onload="leheStart()">
<header>
  <h1>jQuery kasutamine</h1>
</header>
<main>
  <section>
    <h2>jQuery CDN</h2>
    <div id="tekstikast">
      jQuery - see on raamistik (teek)
      <br>
      CDN - raamistiku allalaadimisviis välisserverist
      <br>
      Ametlik CDN asub https://releases.jquery.com
    </div>
    <input type="button" value="vasakule" id="vasakule">
    <input type="button" value="paremale" id="paremale">
    <input type="button" value="peida teksti"
           onclick="$('#tekstikast').hide(2000)">
    <input type="button" value="kuva teksti"
           onclick="$('#tekstikast').show(2000, alert('Kohe kuvab tekt'))">
    <input type="button" value="Fade toggle" id="FadeToggle">

  </section>
  <div id="koordinaadid"></div>
  <img src="https://png.pngtree.com/png-vector/20221226/ourmid/pngtree-vector-transparent-red-arrow-png-image_6538391.png" alt="" id="pilt">
  <img src="https://images-wixmp-ed30a86b8c4ca887773594c2.wixmp.com/f/e3c74ca6-41ed-4110-a143-34af91471636/dm23hn4-71f7fcab-a010-479e-85d3-135cec52949b.png?token=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ1cm46YXBwOjdlMGQxODg5ODIyNjQzNzNhNWYwZDQxNWVhMGQyNmUwIiwiaXNzIjoidXJuOmFwcDo3ZTBkMTg4OTgyMjY0MzczYTVmMGQ0MTVlYTBkMjZlMCIsIm9iaiI6W1t7InBhdGgiOiIvZi9lM2M3NGNhNi00MWVkLTQxMTAtYTE0My0zNGFmOTE0NzE2MzYvZG0yM2huNC03MWY3ZmNhYi1hMDEwLTQ3OWUtODVkMy0xMzVjZWM1Mjk0OWIucG5nIn1dXSwiYXVkIjpbInVybjpzZXJ2aWNlOmZpbGUuZG93bmxvYWQiXX0.LyrT2Nk7s7CLigE-7exABwx52A5ngMN3Vxhy1H0Zo7g" alt="" id="pilt2">
</main>

</body>
</html>
